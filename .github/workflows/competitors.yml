# ===========================================================================
# .github/workflows/competitors.yml — runs the comparison against the other
# validation libraries on a neutral runner.
#
# **What it gates**: agreement on verdicts, and nothing else. That is
# deterministic and machine-independent, so a competitor tightening its email
# rule in a new release fails here and gets noticed. package-lock.json is
# watched for exactly that reason — it is where their versions move.
#
# Speed ratios are printed but never gate. The assumption that a ratio cancels
# out the runner has already been disproved in this repository. The CI figures
# are printed beside the recorded ones, so a difference in magnitude is visible
# to a person.
#
# Measurements are uploaded as an artifact and never committed to config/. A
# CI job writing there would make it impossible to say which run a published
# figure came from.
# ===========================================================================
name: competitors

on:
  # push watches the trunks only. Watching every branch as well as
  # pull_request ran every job TWICE for one commit on a PR branch, which was
  # half of all CI time. To get a result for a working branch, open a PR
  # (draft is fine) or use workflow_dispatch.
  push:
    branches: [master, develop]
    paths:
      - "src/**"
      - "bench/competitors/**"
      - "bench/shapes/**"
      - "bench/hand-written/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/competitors.yml"
  pull_request:
    paths:
      - "src/**"
      - "bench/competitors/**"
      - "bench/shapes/**"
      - "bench/hand-written/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/competitors.yml"
  workflow_dispatch:

concurrency:
  # Grouped by PR number. Grouped by ref, a PR's push event and its
  # pull_request event carry different refs and cannot cancel each other.
  group: competitors-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The re-record step opens a pull request; nothing here writes to a branch
# directly. Read access is all the measurement itself needs.
permissions:
  contents: write
  pull-requests: write

jobs:
  competitors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Measured once. Running the check and the report back to back measured
      # every matchup twice, which was about half the job. --write emits the
      # very measurement the gate judged.
      #
      # continue-on-error, and the job is failed deliberately at the end
      # instead. A failed step skips every step after it, and the step after
      # this one is the one that offers to fix the most common way this fails.
      # `outcome` still reads `failure` here; only `conclusion` is softened.
      - id: measure
        continue-on-error: true
        run: npm run bench:competitors:check -- --write

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: competitor-baseline-${{ github.run_id }}
          path: config/competitor-baseline.json

      # The runner is the recorder.
      #
      # Until now this step did not exist: CI measured on every push, wrote the
      # file, uploaded it as an artifact, and nothing brought it back. So the
      # committed figures were whatever a person last ran on their own machine,
      # and the version they were measured against could sit still for as long
      # as nobody re-ran it. zod's did, for fourteen months.
      #
      # Opening a pull request rather than pushing to master: the numbers move
      # with the runner, so a human should see how much before they become the
      # published comparison. The dependency bump and the re-measurement then
      # arrive as one reviewable change.
      #
      # It is not gated on the check passing, but on WHICH check failed.
      #
      # The version gate failing is the ordinary case this step exists for: the
      # record names a version nobody runs, and re-measuring is the fix. Gating
      # this on success made those two requirements circular, and the gate sat
      # red on master waiting for a re-record that could not run.
      #
      # A moved verdict is the one failure that must NOT be re-recorded here.
      # Writing a competitor's new behaviour into the baseline unreviewed is
      # how a behavioural change stops being visible, so that case skips this
      # and leaves the job red with nothing proposed.
      - name: Open a pull request when the record has moved
        if: >-
          !cancelled()
          && github.event_name == 'push'
          && github.ref == 'refs/heads/master'
          && steps.measure.outputs.agreement-failed != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          base: develop
          branch: bench/re-record-competitors
          add-paths: config/competitor-baseline.json
          commit-message: |
            bench: re-record the competitor baseline on the runner

            Measured by .github/workflows/competitors.yml on ubuntu-latest, which
            is the only machine whose figures are comparable with the ones this
            file already holds.
          title: "bench: re-record the competitor baseline"
          body: |
            The competitor comparison was re-measured on the runner and differs
            from the committed record.

            Read the accepted and rejected columns separately before judging a
            change. A pool that is half refusals measures error construction as
            much as validation, which is how the published zod ratio came to be
            13x higher than the same comparison against a current zod.
          labels: competitor-baseline
          delete-branch: true

      # The job's verdict, moved to the end so the step above could run first.
      # Nothing here is softened: if the check failed, this job is red, and the
      # artifact and the pull request are what it leaves behind for whoever
      # looks at why.
      - name: Fail if the comparison did not pass
        if: steps.measure.outcome == 'failure'
        run: |
          echo "bench:competitors:check failed — see the step above." >&2
          exit 1
