# ===========================================================================
# .github/workflows/competitors.yml — runs the comparison against the other
# validation libraries on a neutral runner.
#
# **What it gates**: agreement on verdicts, and nothing else. That is
# deterministic and machine-independent, so a competitor tightening its email
# rule in a new release fails here and gets noticed. package-lock.json is
# watched for exactly that reason — it is where their versions move.
#
# Speed ratios are printed but never gate. The assumption that a ratio cancels
# out the runner has already been disproved in this repository. The CI figures
# are printed beside the recorded ones, so a difference in magnitude is visible
# to a person.
#
# Measurements are uploaded as an artifact and never committed to config/. A
# CI job writing there would make it impossible to say which run a published
# figure came from.
# ===========================================================================
name: competitors

on:
  # push watches the trunks only. Watching every branch as well as
  # pull_request ran every job TWICE for one commit on a PR branch, which was
  # half of all CI time. To get a result for a working branch, open a PR
  # (draft is fine) or use workflow_dispatch.
  push:
    branches: [master, develop]
    paths:
      - "src/**"
      - "bench/competitors/**"
      - "bench/shapes/**"
      - "bench/hand-written/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/competitors.yml"
  pull_request:
    paths:
      - "src/**"
      - "bench/competitors/**"
      - "bench/shapes/**"
      - "bench/hand-written/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/competitors.yml"
  workflow_dispatch:

concurrency:
  # Grouped by PR number. Grouped by ref, a PR's push event and its
  # pull_request event carry different refs and cannot cancel each other.
  group: competitors-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  competitors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Measured once. Running the check and the report back to back measured
      # every matchup twice, which was about half the job. --write emits the
      # very measurement the gate judged.
      - run: npm run bench:competitors:check -- --write

      - uses: actions/upload-artifact@v4
        with:
          name: competitor-baseline-${{ github.run_id }}
          path: config/competitor-baseline.json
