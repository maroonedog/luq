# ===========================================================================
# .github/workflows/bench.yml — the throughput-ratio gate.
#
# **What it gates**: the ratio between this library and a hand-written
# reference. That only means anything when src/ or bench/ moved; a line of
# README cannot shift it.
#
# A ratio below its floor fails. Absolute ops/sec never gates — on a shared
# runner it fluctuates unconditionally. Floors are per environment, and CI
# reads its own. The original assumption that measuring both in one process
# cancels the runner out has been disproved here: this library allocates while
# the reference is an allocation-free tight loop, so they do not slow down
# together when core count or memory bandwidth changes. A ratio cancels out
# clock speed and nothing else.
#
# Kept out of verify because it takes about a minute per shape and verify is a
# command people run interactively.
# ===========================================================================
name: bench

on:
  # push watches the trunks only. Watching every branch as well as
  # pull_request ran every job TWICE for one commit on a PR branch, which was
  # half of all CI time. To get a result for a working branch, open a PR
  # (draft is fine) or use workflow_dispatch.
  push:
    branches: [master, develop]
    paths:
      - "src/**"
      - "bench/**"
      - "config/perf-baseline*.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/bench.yml"
  pull_request:
    paths:
      - "src/**"
      - "bench/**"
      - "config/perf-baseline*.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

concurrency:
  # Grouped by PR number. Grouped by ref, a PR's push event and its
  # pull_request event carry different refs and cannot cancel each other.
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run bench:gate
