# ===========================================================================
# .github/workflows/bench.yml — スループット比のゲート。
#
# **何を見ているか**: luq と手書き参照の比。src/ か bench/ が動いたときだけ
# 意味がある。README の一行や issue テンプレートは、比を動かしようがない。
#
# 比が床を割ると落ちる。絶対値では落とさない — 共有ランナーの ops/sec は
# 無条件に揺れる (docs/design/test-strategy.md)。床は環境別で、CI は
# config/perf-baseline.ci.json を読む。「同一プロセスで測るからランナーは
# 相殺される」という当初の前提は PR #14 の最初の CI 実行で反証されている:
# luq は割り当てを伴い参照は割り当てゼロの密ループなので、コア数や
# メモリ帯域が変われば同じようには落ちない。相殺するのは CPU クロックだけ。
#
# verify から外してあるのは、形状あたり約1分かかり、verify は対話的に
# 回すコマンドだからである。
# ===========================================================================
name: bench

on:
  # push はトランクだけ。以前は branches: ["**"] と pull_request の両方だったので、
  # PR ブランチへの1コミットが **2回** 全ジョブを回していた (run 34408561896 と
  # 34408566222 は同じコミットである)。CI 時間のちょうど半分がそれだった。
  # 作業ブランチの結果が欲しいときは PR を開く (draft でよい) か、
  # workflow_dispatch を使う。
  push:
    branches: [master, develop]
    paths:
      - "src/**"
      - "bench/**"
      - "config/perf-baseline*.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/bench.yml"
  pull_request:
    paths:
      - "src/**"
      - "bench/**"
      - "config/perf-baseline*.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

concurrency:
  # PR 番号で束ねる。ref で束ねていたときは、同じ PR の push イベントと
  # pull_request イベントが別 ref を持つので互いに打ち消せなかった。
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run bench:gate
