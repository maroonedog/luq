# ===========================================================================
# .github/workflows/docs.yml — サイトがビルドできることを、マージ **前** に見る。
#
# **何を見ているか**: docs-site/ そのものと、サイトが読むもの。サイトは
# src/plugins/manifest.generated.ts (gitignore された生成物) と config/*.json
# を読むので、src/ と config/ と生成スクリプトも監視対象に入る。
#
# これが無かったせいで luq.dev が古いまま配られた。deploy-docs.yml は master
# への push でしか走らないので、docs-site がビルドできないという最初の合図が
# **マージ後の赤** で、その間ずっと前のサイトが配信され続けていた。2026-09-07
# に二度そうなり、どちらもマージは誰にも止められなかった。原因は、どちらの
# workflow も generate:sources を走らせていなかったことである。
# ===========================================================================
name: docs

on:
  # push はトランクだけ。以前は branches: ["**"] と pull_request の両方だったので、
  # PR ブランチへの1コミットが **2回** 全ジョブを回していた (run 34408561896 と
  # 34408566222 は同じコミットである)。CI 時間のちょうど半分がそれだった。
  # 作業ブランチの結果が欲しいときは PR を開く (draft でよい) か、
  # workflow_dispatch を使う。
  push:
    branches: [master, develop]
    paths:
      - "docs-site/**"
      - "src/**"
      - "config/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "src/**"
      - "config/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  # PR 番号で束ねる。ref で束ねていたときは、同じ PR の push イベントと
  # pull_request イベントが別 ref を持つので互いに打ち消せなかった。
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # サイトは生成された plugin manifest を読むので、先に作る。
      - run: npm run generate:sources

      - run: npm run build

      - working-directory: ./docs-site
        run: npm ci

      - working-directory: ./docs-site
        run: npm run build
