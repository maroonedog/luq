# ===========================================================================
# .github/workflows/docs.yml — checks the site builds, **before** the merge.
#
# **What it watches**: docs-site/ itself, plus everything the site reads. The
# site reads a generated plugin manifest and the config files, so src/, config/
# and the generation scripts are watched too.
#
# Without this the published site went stale twice. Deployment only runs on the
# trunk, so the first sign that the site could not build was a red run AFTER
# the merge, and the previous site kept being served throughout. Both times the
# cause was the same: the site's build never ran the source generation step.
# ===========================================================================
name: docs

on:
  # push watches the trunks only. Watching every branch as well as
  # pull_request ran every job TWICE for one commit on a PR branch, which was
  # half of all CI time. To get a result for a working branch, open a PR
  # (draft is fine) or use workflow_dispatch.
  push:
    branches: [master, develop]
    paths:
      - "docs-site/**"
      - "src/**"
      - "config/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "src/**"
      - "config/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  # Grouped by PR number. Grouped by ref, a PR's push event and its
  # pull_request event carry different refs and cannot cancel each other.
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The site reads the generated plugin manifest, so generate it first.
      - run: npm run generate:sources

      - run: npm run build

      - working-directory: ./docs-site
        run: npm ci

      - working-directory: ./docs-site
        run: npm run build
