# ===========================================================================
# .github/workflows/publish.yml — publishing to npm.
#
# **What it watches**: `v*` tags. It publishes the commit the tag points at,
# and never runs on a push to a branch. Publishing cannot be undone, so there
# is exactly one trigger: a person pushed a tag.
#
# It uses **trusted publishing (OIDC)**. Registering this repository and this
# workflow with npm means neither a token nor an OTP is needed, so there is no
# stored credential — and therefore no credential to leak. That is what let
# publishing be automated at all: an OTP can only be typed by a human, which
# is why this step used to be the one left manual.
#
# The one-time setup is in the release documentation. Run without it and the
# job fails immediately before publishing: nothing goes out, and the log says
# what to do.
#
# Provenance is always attached, through publishConfig. Which commit and which
# workflow run produced a tarball becomes verifiable on npm.
# ===========================================================================
name: publish

on:
  push:
    tags: ["v*"]
  # The way back in when a publish fails partway. It accepts **an existing
  # tag** and publishes only what that tag points at. Branch names are refused.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v2.2.0"
        required: true
        type: string

permissions:
  # Needed to obtain the OIDC identity. Without it neither trusted publishing
  # nor provenance works.
  id-token: write
  contents: read

concurrency:
  # Never run the same version twice over. npm would refuse the second one
  # anyway, but only after the whole verify had run again to reach it.
  group: publish-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm
      url: https://www.npmjs.com/package/@maroonedog/luq
    steps:
      # verify reads the JSON-Schema-Test-Suite corpus. Without the submodule
      # conformance cannot be measured and the suite pin check fails.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The npm bundled with this runner's Node predates OIDC, so a newer one
      # is installed. **Pinned to a major, not @latest.** Written as @latest
      # this failed a real release: the newest npm required a Node newer than
      # the runner's, so nothing was published.
      #
      # The lower bound is "knows about OIDC"; the upper bound is "runs on the
      # runner's Node". Moving the Node version means revisiting this line —
      # and note that publishing runs verify through prepublishOnly, so
      # changing Node here changes what was verified relative to the other
      # workflows.
      - name: Use an npm that knows about trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      # Publishing with the tag and package.json out of step puts one version
      # on npm under another version's tag. Only the person who pushed the tag
      # can undo that, so it fails here instead.
      - name: Tag must match the version in package.json
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match $PKG in package.json"
            exit 1
          fi

      # A published version cannot be overwritten. npm refuses it too, but
      # only after several minutes of verify. Check first, fail first.
      - name: Version must not already be on npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published; npm versions are immutable"
            exit 1
          fi
          echo "$NAME@$VERSION is not on npm yet"

      - run: npm ci

      # `npm publish` runs prepublishOnly, which is where verify happens.
      # Calling it explicitly as well would run the same verify twice.
      #
      # access and provenance live in publishConfig rather than as CLI flags,
      # so a publish run by hand carries the same terms.
      - name: Publish
        run: npm publish

      - name: Confirm what npm now serves
        run: |
          NAME="$(node -p "require('./package.json').name")"
          sleep 5
          npm view "$NAME" version
          npm view "$NAME" dist-tags
