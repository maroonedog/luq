# ===========================================================================
# .github/workflows/verify.yml — the gate that has to be green before publish.
#
# 1.x had NO workflow for build or test (docs/legacy-spec/build-and-distribution.md
# defect #9: .github/workflows held only deploy-docs.yml), which is how a
# README whose first example did not compile, a dist whose types and runtime
# disagreed, and 65 filename violations all reached npm.
#
# Two jobs, deliberately split:
#   verify — everything deterministic. Fails on any difference, on any machine.
#   bench  — the throughput RATIO gate. luq と手書き参照を同一プロセスで測る。
#            当初は「だからランナーの速度は比率で相殺される」と書いていたが、
#            その前提は PR #14 の最初の CI 実行で反証された。両者は性能プロ
#            ファイルが違う (luq は割り当てを伴い、参照は割り当てゼロの密ループ)
#            ので、コア数やメモリ帯域が変われば同じようには落ちない。比率が
#            相殺するのは CPU クロックだけ。したがって床は環境別に持ち、CI では
#            config/perf-baseline.ci.json を読む。It is NOT part of
#            `npm run verify`: it costs about a minute per shape and verify is
#            run interactively. It never gates on an absolute ops/sec figure —
#            that flakes unconditionally on a shared runner
#            (docs/design/test-strategy.md).
# ===========================================================================
name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The JSON-Schema-Test-Suite corpus is a pinned submodule. Without it the
      # conformance test cannot measure anything, and check:suite-pin compares
      # the checked-out SHA against config/json-schema-suite.json.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # generate, format, lint, typecheck (src + scripts + bench), type tests,
      # contract-arity / module-reachability / suite-pin, catalog, build,
      # dist gates, doc gates, size + barrel-equivalence, jest.
      - run: npm run verify

      # The published artefact, listed. A file that should not ship shows up in
      # the log of the run that would have published it.
      - run: npm pack --dry-run

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Ratio only. config/perf-baseline.json's absolute figures are recorded
      # on a named machine with `npm run bench:record`; they are never a
      # pass/fail condition here.
      - run: npm run bench:gate

  # docs — the site build, run on every branch rather than only after a merge.
  # It was NOT here, and that is how luq.dev went stale: deploy-docs.yml runs
  # only on push to master, so the first signal that docs-site could not build
  # was a red run AFTER the merge, with the previous site still being served.
  # Two merges failed that way (2026-09-07) and nobody was blocked by either.
  # The break itself: docs-site reads src/plugins/manifest.generated.ts, which
  # is a gitignored derivative, and neither workflow ran `generate:sources`.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # docs-site reads the generated plugin manifest, so it has to exist.
      - run: npm run generate:sources

      - run: npm run build

      - working-directory: ./docs-site
        run: npm ci

      - working-directory: ./docs-site
        run: npm run build
