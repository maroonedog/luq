# ===========================================================================
# .github/workflows/verify.yml — the gate that has to be green before publish.
#
# There was once no workflow for build or test at all, which is how a README
# whose first example did not compile, a dist whose types and runtime
# disagreed, and dozens of filename violations all reached npm.
#
# **What it gates**: everything deterministic. Only checks that give the same
# answer on any machine belong here, and any difference fails the run.
#
# **This is the one workflow with no path filter**, and it stays that way on
# purpose. Changing one line of the README recompiles the examples in it;
# touching a config file re-checks the published figures against it. "I did
# not touch code, so this is safe" is designed not to hold.
#
# Anything that fluctuates lives in its own workflow, each stating at the top
# what it watches.
# ===========================================================================
name: verify

on:
  # push watches the trunks only. Watching every branch as well as
  # pull_request ran every job TWICE for one commit on a PR branch, which was
  # half of all CI time. To get a result for a working branch, open a PR
  # (draft is fine) or use workflow_dispatch.
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  # Grouped by PR number. Grouped by ref, a PR's push event and its
  # pull_request event carry different refs and cannot cancel each other.
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The JSON-Schema-Test-Suite corpus is a pinned submodule. Without it the
      # conformance test cannot measure anything, and check:suite-pin compares
      # the checked-out SHA against config/json-schema-suite.json.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # generate, format, lint, typecheck (src + scripts + bench), type tests,
      # contract-arity / module-reachability / suite-pin, catalog, build,
      # dist gates, doc gates, size + barrel-equivalence, jest.
      - run: npm run verify

      # The code generator has its own tests and, until now, nothing ran
      # them: it is a sub-package with no entry in this file, so it could have
      # been broken by a change here for as long as nobody looked.
      #
      # It names the library by package specifier, so it needs the dist the
      # step above built, reachable under its own node_modules. --ignore-scripts
      # keeps the file: dependency from rebuilding that dist.
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: luq-codegen
      - run: npm run verify
        working-directory: luq-codegen

      # Listed here as well as at the root, because this sub-package publishes
      # its own tarball and the root's pack says nothing about it.
      - run: npm pack --dry-run
        working-directory: luq-codegen

      # The examples compile against the dist built earlier in this job. An
      # example that nothing compiles drifts from the API for the same reason
      # a README does, and these are the only places the Standard Schema seam
      # and the code generator are exercised by a real consumer.
      # --ignore-scripts keeps the file: dependency from rebuilding dist.
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: examples/react-hook-form
      - run: npm run typecheck
        working-directory: examples/react-hook-form

      # This one generates first: the checked-in tree has no generated file, so
      # a generator that stopped working fails here rather than passing on a
      # stale copy someone committed. It imports the generator as an installed
      # package, so luq-codegen has to have been built earlier in this job.
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: examples/openapi
      - run: npm run verify
        working-directory: examples/openapi

      # The published artefact, listed. A file that should not ship shows up in
      # the log of the run that would have published it.
      - run: npm pack --dry-run
