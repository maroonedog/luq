# ===========================================================================
# .github/workflows/verify.yml — the gate that has to be green before publish.
#
# 1.x had NO workflow for build or test (docs/legacy-spec/build-and-distribution.md
# defect #9: .github/workflows held only deploy-docs.yml), which is how a
# README whose first example did not compile, a dist whose types and runtime
# disagreed, and 65 filename violations all reached npm.
#
# **何を見ているか**: 決定的なものすべて。どの機械でも同じ答えが出るものだけを
# ここに置き、差があれば落とす。
#
# **path フィルタを掛けていない唯一の workflow である。** 掛けたくなるが、
# 掛けられない: README を一行変えると check:doc-examples がその例を
# コンパイルし直し、config/*.json を触ると check:perf-figures が公開値との
# ずれを見る。「コードを触っていないから安全」が成り立たない設計に、意図して
# してある。
#
# 揺れるものは別の workflow に分けた。それぞれ自分が見ているものを冒頭に
# 書いてある:
#   bench.yml       — スループット比。src/ か bench/ が動いたときだけ
#   docs.yml        — サイトがビルドできるか。docs-site/ と、それが読むもの
#   competitors.yml — 競合との判定一致。src/ と競合の版が動いたときだけ
# ===========================================================================
name: verify

on:
  # push はトランクだけ。以前は branches: ["**"] と pull_request の両方だったので、
  # PR ブランチへの1コミットが **2回** 全ジョブを回していた (run 34408561896 と
  # 34408566222 は同じコミットである)。CI 時間のちょうど半分がそれだった。
  # 作業ブランチの結果が欲しいときは PR を開く (draft でよい) か、
  # workflow_dispatch を使う。
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  # PR 番号で束ねる。ref で束ねていたときは、同じ PR の push イベントと
  # pull_request イベントが別 ref を持つので互いに打ち消せなかった。
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The JSON-Schema-Test-Suite corpus is a pinned submodule. Without it the
      # conformance test cannot measure anything, and check:suite-pin compares
      # the checked-out SHA against config/json-schema-suite.json.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # generate, format, lint, typecheck (src + scripts + bench), type tests,
      # contract-arity / module-reachability / suite-pin, catalog, build,
      # dist gates, doc gates, size + barrel-equivalence, jest.
      - run: npm run verify

      # The published artefact, listed. A file that should not ship shows up in
      # the log of the run that would have published it.
      - run: npm pack --dry-run
