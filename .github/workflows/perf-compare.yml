# ===========================================================================
# .github/workflows/perf-compare.yml — before and after, on ONE machine.
#
# Every other workflow here answers a question about one tree. This one answers
# the only question a performance change actually raises: is it faster than
# what it replaces, measured the same way.
#
# **It measures both sides inside one job on purpose.** Two runs of the bench
# workflow, one on each branch, land on whatever runners GitHub had free, and
# those differ: the recorded competitor baselines in this repository have come
# back on a Xeon 6973P-C, a Xeon Platinum 8573C and an EPYC 7763 within two
# days of each other, and the same shape moved by more than any change being
# considered. Comparing across them measures the fleet, not the library.
#
# **ONE FLOOR RUN DOES NOT GIVE YOU THE FLOOR.** With `base` and `head` at the
# same commit the output is a floor reading, and the first one taken here said
# +-2%. It was wrong. Two runs of the same real comparison, same machine model,
# same fourteen rounds, then disagreed by eleven points on one shape and
# flipped its sign:
#
#   shape        run 1     run 2
#   singleField  +13.6%    +5.4%
#   multiField    -5.0%    +6.1%
#
# So fourteen rounds on a four-core runner does not resolve five percent, and a
# single floor reading is itself one sample of a noisy thing. Take several, on
# different days, before believing any figure this prints.
#
# **What DOES reproduce here is allocation**, not wall-clock: bytes per call
# came back inside 1% across every process it was measured in, including the
# ones whose timings disagreed. If something in this repository is ever gated
# on a measurement, that is the measurement with a floor small enough to gate.
#
# Nothing here is a gate. It prints a table into the job summary and never
# fails on a number.
# ===========================================================================
name: perf-compare

on:
  # THE MEASURING BRANCH. Force-push a working branch here and this file, AS IT
  # STANDS ON THAT BRANCH, runs against develop.
  #
  # workflow_dispatch alone was unworkable, and three defects in a row proved
  # it: dispatch reads the copy on the DEFAULT branch, so the first use of any
  # change to this workflow is also its first test, and every fix costs a merge
  # to master. A concurrency group that cancelled the floor run, a ref the
  # checkout action could not resolve, and a measuring script that neither side
  # carried each took a full merge to find. A push trigger on a fixed branch
  # costs a force-push.
  #
  # It is one branch on purpose rather than a pattern: a pattern would measure
  # every working branch somebody pushed, and each run is half an hour of a
  # four-core machine. Nothing is published from here and nothing is gated on
  # it — the branch is a bench, and what lands on it is whatever is being
  # measured today.
  push:
    branches: [bench/measure]

  workflow_dispatch:
    inputs:
      base:
        description: "Ref to measure against (the 'before' side)"
        required: true
        default: "develop"
        type: string
      head:
        description: "Ref to measure (the 'after' side). Defaults to this branch."
        required: false
        default: ""
        type: string
      rounds:
        description: "Readings per side. Fewer than ten does not resolve 5%."
        required: false
        default: "14"
        type: string

# Keyed by the PAIR being compared, not by the ref. Every dispatch of this
# workflow runs from the default branch, so a group named after the ref put
# every comparison in one bucket — and the first thing anyone does is dispatch
# twice in a row, once with both sides at the same commit to establish the
# floor and once for the real question. Grouping by ref cancelled the floor
# run the moment the second was queued, which is how this was found.
#
# Two dispatches of the SAME pair still cancel, which is what cancelling is
# for: the second is a re-run and the first is stale.
concurrency:
  group: perf-compare-${{ inputs.base || 'develop' }}-${{ inputs.head || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Both sides are fetched WHOLE and then checked out by git, rather than
      # handed to the action as `ref`. The action resolves a ref by fetching
      # that one name at depth 1, which accepts a branch, a tag or a full
      # forty-character SHA and fails on anything else — an abbreviated SHA
      # fetches nothing and the step dies after three retries saying only
      # "git failed with exit code 1". The first real use of this workflow
      # passed short SHAs, because that is what `git log --oneline` prints.
      # `git checkout` takes all four forms, so the resolving is left to it.
      - name: Check out the head side
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: head

      - name: Check out the base side
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: base

      # A third checkout, at the ref this workflow was dispatched from, holding
      # the measuring apparatus. Neither side can supply it: for a comparison
      # the base predates it, and for a floor run BOTH sides do, which is how
      # this was found — the first floor run died on
      # "Cannot find module './measure-side.ts'".
      - name: Check out the apparatus
        uses: actions/checkout@v5
        with:
          path: tooling

      # Resolved to a commit BEFORE checking out. A bare branch name that has no
      # local branch — which is every branch in a fresh checkout except the one
      # it landed on — makes git try to create it from the remote, and that
      # collides with --detach: "'--detach' cannot be used with '-b/-B/--orphan'".
      # Trying the name, then the name under origin/, accepts a branch, a tag, a
      # short SHA and a full one, which is the whole point of resolving here
      # rather than handing the ref to actions/checkout.
      - name: Move each side to the ref it is measuring
        run: |
          set -euo pipefail
          resolve() {
            git -C "$1" rev-parse --verify --quiet "$2^{commit}" \
              || git -C "$1" rev-parse --verify --quiet "origin/$2^{commit}" \
              || { echo "::error::cannot resolve '$2' in $1" >&2; return 1; }
          }
          git -C head checkout --detach "$(resolve head "${HEAD_REF}")"
          git -C base checkout --detach "$(resolve base "${BASE_REF}")"
          echo "head is $(git -C head rev-parse HEAD)  ($(git -C head log -1 --format=%s))"
          echo "base is $(git -C base rev-parse HEAD)  ($(git -C base log -1 --format=%s))"
          if [ "$(git -C head rev-parse HEAD)" = "$(git -C base rev-parse HEAD)" ]; then
            echo "Both sides are the same commit: this run measures the FLOOR."
          fi
        env:
          HEAD_REF: ${{ inputs.head != '' && inputs.head || github.sha }}
          BASE_REF: ${{ inputs.base != '' && inputs.base || 'develop' }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # BOTH SIDES GET THE SAME bench/. This is the point of the whole job.
      # A comparison is only about src/ if everything around it is held still,
      # and bench/ changes: the competitor figures in this repository jumped
      # 1.74M -> 2.80M -> 4.13M ops/sec over two days with a harness rewrite
      # inside each interval, so not one of those steps could be attributed to
      # the library. Each side keeps its own src/, package.json and lockfile;
      # only the apparatus is made identical.
      - name: Give both sides the same harness
        run: |
          set -euo pipefail
          for side in base head; do
            rm -rf "$side/bench"
            cp -r tooling/bench "$side/bench"
          done
          echo "bench/ on both sides is now $(git -C tooling rev-parse --short HEAD)"

      # Each side builds with its OWN lockfile. Sharing one would measure the
      # head's dependencies under the base's code, which is neither side.
      - name: Install the base side
        run: npm ci
        working-directory: base

      - name: Install the head side
        run: npm ci
        working-directory: head

      - name: Say which machine this is
        run: node -e "const os=require('os');console.log(os.cpus()[0].model, '|', os.cpus().length, 'logical cores')"

      - name: Measure, alternating sides
        run: node tooling/bench/compare/compare-checkouts.mjs base head ${{ inputs.rounds != '' && inputs.rounds || '14' }}
