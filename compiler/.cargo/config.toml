[build]
# Separate target directories for different environments
# This prevents cross-platform binary conflicts

[env]
CARGO_TARGET_DIR = { value = "target-wsl", relative = true }

# Use specific rustflags to avoid proc-macro issues
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "prefer-dynamic"]

# Profile for rust-analyzer
[profile.dev.build-override]
opt-level = 0
debug = false