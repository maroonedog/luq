[package]
name = "luq-compiler"
version = "0.1.0"
edition = "2021"
authors = ["Luq Contributors"]
description = "Compiler for .luq DSL - TypeScript-like validation definition language"
license = "MIT"
repository = "https://github.com/maroonedog/luq"
build = "build.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# Parallel processing
rayon = "1.7"
num_cpus = "1.16"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Parsing utilities
logos = "0.14"  # Fast lexer generator
chumsky = "0.9"  # Parser combinator library with excellent error recovery
ariadne = "0.4"  # Beautiful error reporting

# Data structures
indexmap = "2.0"
smallvec = "1.11"

# File system
glob = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Code generation helpers
indoc = "2.0"

# Debug utilities
chrono = "0.4"

[dev-dependencies]
insta = "1.34"  # Snapshot testing
pretty_assertions = "1.4"
tempfile = "3.8"  # Temporary files for testing

[[bin]]
name = "luqc"
path = "src/main.rs"

[profile.release]
opt-level = 2

[dependencies.env_logger]
version = "0.10"
