openapi: 3.0.3
info:
  title: Orders
  version: 1.0.0
paths:
  /orders:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "201":
          description: Created
components:
  schemas:
    Order:
      type: object
      required: [id, customer, lines]
      properties:
        id:
          type: string
          format: uuid
        customer:
          type: object
          required: [email]
          properties:
            name:
              type: string
              minLength: 2
            email:
              type: string
              format: email
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku:
                type: string
                minLength: 3
              quantity:
                type: integer
                minimum: 1
